name: Security and build checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies and reconcile lockfile
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking security updates
        run: npm audit fix --no-fund
      - name: Audit all dependency severities
        run: npm audit --audit-level=low
      - name: Commit refreshed lockfile to dependency refresh PR
        if: github.event_name == 'pull_request' && github.head_ref == 'dependency-lock-refresh'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh audited dependency lockfile [skip ci]"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

  production-build:
    name: Clean install and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production bundle
        run: npm run build
